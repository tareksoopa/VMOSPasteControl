name: Build VMOSPasteFixed2
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          "$CLANG" -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -dynamiclib VMOSPasteFixed2.m \
            -framework UIKit -framework Foundation -framework WebKit -framework UniformTypeIdentifiers \
            -install_name @rpath/VMOSPasteFixed2.dylib \
            -o VMOSPasteFixed2.dylib
          codesign --force --sign - VMOSPasteFixed2.dylib
          file VMOSPasteFixed2.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: VMOSPasteFixed2-dylib
          path: VMOSPasteFixed2.dylib
