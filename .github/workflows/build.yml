name: Build VMOSAutoClipboardHidden
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          "$CLANG" -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -dynamiclib VMOSAutoClipboardHidden.m \
            -framework UIKit -framework Foundation -framework WebKit \
            -install_name @rpath/VMOSAutoClipboardHidden.dylib \
            -o VMOSAutoClipboardHidden.dylib
          codesign --force --sign - VMOSAutoClipboardHidden.dylib
          file VMOSAutoClipboardHidden.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: VMOSAutoClipboardHidden-dylib
          path: VMOSAutoClipboardHidden.dylib
