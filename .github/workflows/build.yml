name: Build VMOSPasteFixed
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          "$CLANG" -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -dynamiclib VMOSPasteFixed.m \
            -framework UIKit -framework Foundation -framework WebKit -framework UniformTypeIdentifiers \
            -install_name @rpath/VMOSPasteFixed.dylib \
            -o VMOSPasteFixed.dylib
          codesign --force --sign - VMOSPasteFixed.dylib
          file VMOSPasteFixed.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: VMOSPasteFixed-dylib
          path: VMOSPasteFixed.dylib
