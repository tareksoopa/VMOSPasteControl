name: Build VMOSPasteFinal
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build dylib
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          "$CLANG" -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -dynamiclib VMOSPasteFinal.m \
            -framework UIKit -framework Foundation -framework WebKit \
            -install_name @rpath/VMOSPasteFinal.dylib \
            -o VMOSPasteFinal.dylib
          codesign --force --sign - VMOSPasteFinal.dylib
          file VMOSPasteFinal.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: VMOSPasteFinal-dylib
          path: VMOSPasteFinal.dylib
