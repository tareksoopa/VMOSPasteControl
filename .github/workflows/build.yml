name: Build VMOSClipboardItemInspector
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos --find clang)"
          "$CLANG" -arch arm64 -isysroot "$SDK" -miphoneos-version-min=16.0 \
            -fobjc-arc -dynamiclib VMOSClipboardItemInspector.m \
            -framework UIKit -framework Foundation -framework WebKit \
            -install_name @rpath/VMOSClipboardItemInspector.dylib \
            -o VMOSClipboardItemInspector.dylib
          codesign --force --sign - VMOSClipboardItemInspector.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: VMOSClipboardItemInspector-dylib
          path: VMOSClipboardItemInspector.dylib
